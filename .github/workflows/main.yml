# =============================================================================
# Pipeline CI/CD - API REST de tareas
#
#   1. test        -> pruebas (Jest + Supertest) y cobertura con umbral del 70%
#   2. build-push  -> imagen Docker con tags :latest y :<sha> publicada en Docker Hub
#   3. deploy      -> despliegue en AWS EC2 por SSH y verificacion de /api/health
#
# En pull_request solo se ejecutan las pruebas (no se publica ni se despliega).
# Todos los datos sensibles vienen de GitHub Secrets:
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, EC2_HOST, EC2_USER, EC2_SSH_KEY
# =============================================================================
name: CI/CD - API Tareas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Evita dos despliegues simultaneos sobre el mismo servidor
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: webapp-taskmanager
  CONTAINER_NAME: webapp-taskmanager

jobs:
  # ---------------------------------------------------------------------------
  test:
    name: 1. Pruebas y cobertura
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v7

      - name: Configurar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas con cobertura (falla si es menor al 70%)
        run: npm run test:ci

      - name: Resumen de cobertura
        if: always()
        run: npm run coverage:summary

      - name: Guardar reporte HTML de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # ---------------------------------------------------------------------------
  build-push:
    name: 2. Build y push a Docker Hub
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v7

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Iniciar sesion en Docker Hub (Personal Access Token)
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar imagen (:latest y :sha)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen de la imagen publicada
        run: |
          {
            echo "## Imagen publicada en Docker Hub"
            echo ""
            echo "| Tag | Valor |"
            echo "|---|---|"
            echo "| latest | \`${IMAGE_NAME}:latest\` |"
            echo "| commit | \`${IMAGE_NAME}:${GITHUB_SHA}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  deploy:
    name: 3. Despliegue en AWS EC2
    needs: build-push
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar la nueva version por SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          GIT_SHA: ${{ github.sha }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,GIT_SHA,IMAGE_NAME,CONTAINER_NAME
          command_timeout: 10m
          script: |
            set -e
            NEW_IMAGE="$DOCKERHUB_USERNAME/$IMAGE_NAME:$GIT_SHA"

            echo "==> 1/5 Descargando la nueva imagen: $IMAGE_NAME:$GIT_SHA"
            # Se descarga ANTES de detener la version actual para reducir el tiempo fuera de servicio
            sudo docker pull "$NEW_IMAGE"

            PREV_IMAGE=$(sudo docker inspect --format '{{.Config.Image}}' "$CONTAINER_NAME" 2>/dev/null || true)
            echo "==> 2/5 Version en ejecucion: ${PREV_IMAGE:-ninguna}"

            echo "==> 3/5 Deteniendo el contenedor antiguo"
            # 'webapp-container' es el contenedor de practicas anteriores (ocupaba el puerto 6061)
            sudo docker rm -f "$CONTAINER_NAME" webapp-container >/dev/null 2>&1 || true

            echo "==> 4/5 Levantando la nueva version en el puerto 80"
            sudo docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p 80:3000 -p 6061:6061 \
              -v taskmanager-data:/app/data \
              "$NEW_IMAGE"

            echo "==> 5/5 Verificando /api/health"
            for i in $(seq 1 20); do
              if curl -fsS http://localhost/api/health > /tmp/health.json 2>/dev/null; then
                echo "API arriba:"; cat /tmp/health.json; echo
                sudo docker image prune -f >/dev/null
                exit 0
              fi
              sleep 2
            done

            echo "ERROR: la nueva version no respondio. Restaurando la version anterior..."
            sudo docker logs --tail 50 "$CONTAINER_NAME" || true
            sudo docker rm -f "$CONTAINER_NAME" || true
            if [ -n "$PREV_IMAGE" ]; then
              sudo docker run -d --name "$CONTAINER_NAME" --restart unless-stopped \
                -p 80:3000 -p 6061:6061 -v taskmanager-data:/app/data "$PREV_IMAGE"
            fi
            exit 1

      - name: Verificar la API publica desde internet
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          for i in $(seq 1 10); do
            if RESP=$(curl -fsS "http://${EC2_HOST}/api/health"); then break; fi
            sleep 3
          done
          echo "Respuesta de /api/health: $RESP"
          echo "$RESP" | grep -q "$GITHUB_SHA" || { echo "El servidor no reporta el commit $GITHUB_SHA"; exit 1; }
          {
            echo "## Despliegue verificado"
            echo ""
            echo "El servidor responde en \`/api/health\` con el commit \`${GITHUB_SHA}\`."
          } >> "$GITHUB_STEP_SUMMARY"
